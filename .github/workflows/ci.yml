name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  build:
    name: Type check & build
    # arm64: matches the fleet's standard runner architecture (athena is
    # all arm64); free for public repos. Bun ships native linux-arm64.
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run check

      - name: Build
        run: bun run build
